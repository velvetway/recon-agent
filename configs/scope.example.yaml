# Scope-конфиг программы bug bounty.
# Двойной scope-guard читает этот файл: любое действие вне in_scope
# либо попавшее в out_of_scope — блокируется.
program: "Standoff365"
platform: "standoff365"

# Уровень «шумности» разведки — потолок для всех инструментов:
#   passive — только пассивный сбор, без обращений к целям (по умолчанию)
#   light   — лёгкие прямые обращения: DNS-резолв, HTTP-проб
#   active  — активное сканирование: перебор портов и путей
# Инструмент, которому нужен уровень выше, на этой программе не запустится.
profile: "light"

# Что разрешено трогать.
in_scope:
  domains:
    - "*.standoff365.com"
    - "standoff365.com"
  cidrs: []          # напр. "203.0.113.0/24"
  wildcards: true    # разрешить раскрытие поддоменов по wildcard

# Заголовки, добавляемые к каждому HTTP-запросу инструментов.
# Многие программы требуют обязательный заголовок (например, Standoff365:
# "X-BugBounty: <id>"), без которого запросы считаются несанкционированными.
# СЕКРЕТЫ сюда не пишите — передавайте через переменную окружения:
#   export RECON_HTTP_HEADERS="X-BugBounty: <ваш-id>"
# (несколько заголовков — по одному на строку). Значение из env переопределяет
# одноимённый заголовок отсюда и не попадает в файл и логи.
http_headers:
  - "User-Agent: recon-agent"

# Что запрещено явно (имеет приоритет над in_scope).
out_of_scope:
  domains:
    - "blog.standoff365.com"
    - "docs.standoff365.com"
  cidrs: []

# Ограничения скорости, чтобы не словить бан на программе.
rate_limits:
  global_rps: 20          # суммарно по всем целям
  per_target_rps: 5       # на один хост
  max_concurrent_scans: 4 # одновременных задач сканирования
